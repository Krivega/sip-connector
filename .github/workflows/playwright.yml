name: Playwright Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install -g yarn && yarn
      - name: Install Playwright Browsers
        run: yarn playwright install --with-deps
      - name: Run Playwright tests
        run: |
          yarn playwright test e2e/signaling-loss-real-server.spec.ts -g "переоткрывает" --retries=0 --repeat-each=2 || true
          E2E_ANONYMOUS=1 yarn playwright test e2e/signaling-loss-real-server.spec.ts -g "переоткрывает" --retries=0 --repeat-each=2
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
